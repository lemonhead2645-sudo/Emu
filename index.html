<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Emulator</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  #setup { margin: 40px 16px 20px; text-align: center; max-width: 520px; }
  h1 { font-size: 1.4rem; margin-bottom: 6px; }
  p { opacity: .75; font-size: .9rem; }
  .row { margin: 12px 0; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  select, button, input[type=file] { background: #222; color: #eee; border: 1px solid #555; border-radius: 6px; padding: 8px 12px; font-size: .95rem; }
  button { background: #3b6ef0; border-color: #3b6ef0; cursor: pointer; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #wrap { width: min(96vw, 900px); height: min(70vh, 640px); display: none; }
  #game { width: 100%; height: 100%; }
  #err { color: #ff8a8a; min-height: 1.2em; }
</style>
</head>
<body>
<div id="setup">
  <h1>My Emulator</h1>
  <p>Choose a game file you own, pick the system, and press Start. The file stays on your device and is never uploaded.</p>
  <div class="row">
    <input type="file" id="rom">
    <select id="core">
      <option value="auto">Auto-detect from file</option>
      <option value="gba">Game Boy Advance</option>
      <option value="gb">Game Boy / Color</option>
      <option value="nes">NES</option>
      <option value="snes">SNES</option>
      <option value="segaMD">Sega Genesis</option>
      <option value="nds">Nintendo DS</option>
    </select>
  </div>
  <div class="row"><button id="start" disabled>Start</button></div>
  <div id="err"></div>
</div>
<div id="wrap"><div id="game"></div></div>

<script>
// Where EmulatorJS files are loaded from.
// Online: leave as the CDN. Offline: download the EmulatorJS "data" folder,
// put it next to this file, and change this to "./data/".
const DATA_PATH = "https://cdn.emulatorjs.org/stable/data/";

const extToCore = {
  gba: "gba", gb: "gb", gbc: "gb", nes: "nes", sfc: "snes", smc: "snes",
  md: "segaMD", gen: "segaMD", nds: "nds"
};

const romInput = document.getElementById("rom");
const startBtn = document.getElementById("start");
const err = document.getElementById("err");
let file = null;

romInput.addEventListener("change", () => {
  file = romInput.files[0] || null;
  startBtn.disabled = !file;
  err.textContent = "";
});

startBtn.addEventListener("click", () => {
  if (!file) return;
  let core = document.getElementById("core").value;
  if (core === "auto") {
    const ext = file.name.split(".").pop().toLowerCase();
    core = extToCore[ext];
    if (!core) { err.textContent = "Could not detect the system. Pick it from the list."; return; }
  }

  document.getElementById("setup").style.display = "none";
  document.getElementById("wrap").style.display = "block";

  window.EJS_player = "#game";
  window.EJS_core = core;
  window.EJS_gameUrl = URL.createObjectURL(file);
  window.EJS_gameName = file.name.replace(/\.[^.]+$/, "");
  window.EJS_pathtodata = DATA_PATH;
  window.EJS_startOnLoaded = true;

  const s = document.createElement("script");
  s.src = DATA_PATH + "loader.js";
  s.onerror = () => {
    document.getElementById("setup").style.display = "block";
    document.getElementById("wrap").style.display = "none";
    err.textContent = "Could not load EmulatorJS. Check your connection or the DATA_PATH setting.";
  };
  document.body.appendChild(s);
});
</script>
</body>
</html>
