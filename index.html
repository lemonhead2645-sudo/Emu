<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play My Game</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
  #intro { text-align: center; padding: 20px; }
  h1 { margin: 0 0 8px; }
  p { opacity: .75; }
  #play { background: #3b6ef0; color: #fff; border: none; border-radius: 10px; padding: 16px 40px; font-size: 1.3rem; cursor: pointer; }
  #play:hover { background: #4d7df5; }
  #err { color: #ff8a8a; margin-top: 12px; min-height: 1.2em; }
  #wrap { width: min(96vw, 900px); height: min(80vh, 640px); display: none; }
  #game { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="intro">
  <h1 id="title">Pokemon Sapphire</h1>
  <p>Press the button to start. Works best on a computer with a keyboard.</p>
  <button id="play">Play</button>
  <div id="err"></div>
</div>
<div id="wrap"><div id="game"></div></div>

<script>
// ---- Edit these three settings ----
const GAME_TITLE = "Pokemon Sapphire";            // shown on the page
const ROM_FILE   = "Pokemon Sapphire.gba";           // your game's file name, in the same folder as this page
const CORE       = "gba";                // gba, gb, nes, snes, segaMD, nds
// -----------------------------------

const DATA_PATH = "https://cdn.emulatorjs.org/stable/data/";

document.getElementById("title").textContent = GAME_TITLE;
document.title = GAME_TITLE;

document.getElementById("play").addEventListener("click", () => {
  document.getElementById("intro").style.display = "none";
  document.getElementById("wrap").style.display = "block";

  window.EJS_player = "#game";
  window.EJS_core = CORE;
  window.EJS_gameUrl = ROM_FILE;
  window.EJS_gameName = GAME_TITLE;
  window.EJS_pathtodata = DATA_PATH;
  window.EJS_startOnLoaded = true;

  const s = document.createElement("script");
  s.src = DATA_PATH + "loader.js";
  s.onerror = () => {
    document.getElementById("intro").style.display = "block";
    document.getElementById("wrap").style.display = "none";
    document.getElementById("err").textContent = "Could not load the emulator. Check your internet connection.";
  };
  document.body.appendChild(s);
});
</script>
</body>
</html>
