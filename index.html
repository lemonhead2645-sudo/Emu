<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>True's Study Time</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
  #intro { text-align: center; padding: 20px; }
  h1 { margin: 0 0 8px; }
  p { opacity: .75; }
  select { background: #222; color: #eee; border: 1px solid #555; border-radius: 8px; padding: 12px 16px; font-size: 1.1rem; min-width: 260px; }
  #play { display: block; margin: 16px auto 0; background: #3b6ef0; color: #fff; border: none; border-radius: 10px; padding: 14px 40px; font-size: 1.2rem; cursor: pointer; }
  #play:hover { background: #4d7df5; }
  #err { color: #ff8a8a; margin-top: 12px; min-height: 1.2em; }
  #wrap { width: min(96vw, 900px); height: min(80vh, 640px); display: none; }
  #game { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="intro">
  <h1>Pokemon Games</h1>
  <p>Pick a game, then press Play.</p>
  <select id="picker"></select>
  <button id="play">Play</button>
  <div id="err"></div>
</div>
<div id="wrap"><div id="game"></div></div>

<script>
// ---- Add your games here. One line per game. ----
// title: name shown in the menu
// file:  the game's file name, in the same folder as this page
// core:  gba, gb, nes, snes, segaMD, or nds
const GAMES = [
  { title: "Pokemon Sapphire",  file: "Pokemon Sapphire.gba", core: "gba" },
  { title: "Pokemon FireRed", file: "Pokemon FireRed.gba", core: "gba"  },
  { title: "Pokemon Crystal",  file: "Pokemon Crystal.gbc", core: "gbc" }
];
// -------------------------------------------------

const DATA_PATH = "https://cdn.emulatorjs.org/stable/data/";
const picker = document.getElementById("picker");

GAMES.forEach((g, i) => {
  const opt = document.createElement("option");
  opt.value = i;
  opt.textContent = g.title;
  picker.appendChild(opt);
});

// Remember the last game picked on this device
try {
  const saved = localStorage.getItem("lastGame");
  if (saved !== null && GAMES[saved]) picker.value = saved;
} catch (e) {}

document.getElementById("play").addEventListener("click", () => {
  const game = GAMES[picker.value];
  try { localStorage.setItem("lastGame", picker.value); } catch (e) {}

  document.getElementById("intro").style.display = "none";
  document.getElementById("wrap").style.display = "block";
  document.title = game.title;

  window.EJS_player = "#game";
  window.EJS_core = game.core;
  window.EJS_gameUrl = game.file;
  window.EJS_gameName = game.title;
  window.EJS_pathtodata = DATA_PATH;
  window.EJS_startOnLoaded = true;

  const s = document.createElement("script");
  s.src = DATA_PATH + "loader.js";
  s.onerror = () => {
    document.getElementById("intro").style.display = "block";
    document.getElementById("wrap").style.display = "none";
    document.getElementById("err").textContent = "Could not load the emulator. Check your internet connection.";
  };
  document.body.appendChild(s);
});
</script>
</body>
</html>
